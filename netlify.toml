# KEIN Build-Schritt. Der Ordner "site" wird unveraendert veroeffentlicht.
# Gebaut wird lokal mit tools/editorial-look.py, siehe EINSPIELEN.md.

[build]
  publish = "site"
  # Leerer Befehl = ausdruecklich kein Build. Muss dastehen: laesst man
  # "command" ganz weg, greift der Build-Befehl aus den Netlify-Einstellungen.
  command = ""

# /dunkel/, /noir/ und /v3/ waren eigene Versionen. Alte Lesezeichen landen
# auf der Hauptadresse.
# Feed Studio (Version 2 zum Verkaufen) liegt fertig gebaut unter /v2/.
# Ohne Schraegstrich wuerden die relativen Pfade nicht stimmen.
[[redirects]]
  from = "/v2"
  to = "/v2/"
  status = 301

[[redirects]]
  from = "/dunkel/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/noir/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/v3/*"
  to = "/"
  status = 301

# Die Profilbilder sind eine eigene Seite, keine Route der App.
# Ohne diese Regel schluckt die Auffangregel darunter den Pfad und es
# kaeme die App zurueck statt der Seite.
[[redirects]]
  from = "/profilbilder/*"
  to = "/profilbilder/index.html"
  status = 200

# Alte App-Dateinamen (index-B5kartenNNN.js), die es nicht mehr gibt, landen
# auf der aktuellen Version. Greift nur, wenn die Datei fehlt. Bei jedem
# neuen Build die Nummer hier mitziehen (siehe EINSPIELEN.md).
[[redirects]]
  from = "/assets/index-B5karten*"
  to = "/assets/index-B5karten592.js"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"

# Die Regel unten galt nur fuer den Pfad "/index.html". Wer die App
# unter "/" aufmacht — also alle — bekam sie nicht, weil Netlify die
# Kopfzeilen nach dem angefragten Pfad zuordnet und nicht nach der
# Datei, die am Ende ausgeliefert wird. Deshalb blieb ein alter Stand
# im Browser haengen. Beide Pfade brauchen die Regel.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/profilbilder/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/stil-schalter.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/v2/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/v2/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
