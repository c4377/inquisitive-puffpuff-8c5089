# KEIN Build-Schritt. Der Ordner "site" wird unveraendert veroeffentlicht.
# Der Quellcode in src/ ist aelter als die laufende App und dient nur als Archiv.
# Siehe EINSPIELEN.md.

[build]
  publish = "site"
  # Leerer Befehl = ausdruecklich kein Build. Muss dastehen: laesst man
  # "command" ganz weg, greift der Build-Befehl aus den Netlify-Einstellungen,
  # und der wuerde die App aus dem veralteten src/ neu bauen.
  command = ""

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
