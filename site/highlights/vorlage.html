<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Highlight-Vorlage</title>
<style>
@font-face{font-family:"Feed Serif";src:url(/fonts/FeedSerif-LightItalic.woff2) format("woff2");font-style:italic;font-weight:400}
@font-face{font-family:"HN";src:url(/fonts/HelveticaNeue-Medium.otf);font-weight:500}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
#k{position:relative;width:1080px;height:1920px;display:flex;flex-direction:column;align-items:center;justify-content:center}
#korn{position:absolute;inset:0;pointer-events:none}
#linie{width:64px;height:3px;margin-bottom:56px}
#wort{font-family:"Feed Serif";font-style:italic;font-size:178px;line-height:.98;letter-spacing:-2px;text-align:center}
#nr{font-family:"HN";font-weight:500;font-size:28px;letter-spacing:12px;margin-top:64px;padding-left:12px}
</style></head><body><div id="k"><svg id="korn" width="1080" height="1920"><filter id="f"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect id="kr" width="100%" height="100%" filter="url(#f)"/></svg><div id="linie"></div><div id="wort"></div><div id="nr"></div></div>
<script>
window.zeichne=(r,w,nr)=>{const k=document.getElementById('k');k.style.background=r.bg;document.getElementById('kr').setAttribute('opacity',r.korn);
document.getElementById('linie').style.background=r.linie;const wo=document.getElementById('wort');wo.style.color=r.ink;wo.innerHTML=w.join('<br>');
const n=document.getElementById('nr');n.style.color=r.nr;n.textContent='N° '+nr;let fs=178;wo.style.fontSize=fs+'px';while(wo.scrollWidth>840&&fs>60){fs-=4;wo.style.fontSize=fs+'px'}};
</script></body></html>
