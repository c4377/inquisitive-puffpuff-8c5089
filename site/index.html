<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visual Branding App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=Syne:wght@600;700&family=Archivo:wght@400;500&family=Playfair:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700;1,800&family=Poppins:wght@300;400;500;600&family=Caveat:wght@400;500;600;700&family=La+Belle+Aurore&family=Courier+Prime:wght@400;700&family=Outfit:wght@300;400;500;600;700;800&family=Anton&family=Archivo+Black&family=Sacramento&display=swap" rel="stylesheet">
    <!-- Welcher Stil. Der Pfad entscheidet und merkt es sich, weil die
         App ihre eigenen Adressen setzt (/content-planner und so weiter)
         und dabei das "/dunkel" verliert. Ohne das Merken waere der
         Zwilling nach dem ersten Klick wieder hell.
           /dunkel/...  schaltet dunkel und merkt es
           /            schaltet zurueck auf den Grundstil
           alles andere behaelt, was zuletzt galt
         Laeuft als gewoehnliches Skript, also VOR dem Modul. -->
    <script>try{var p=location.pathname;
      if(p.indexOf("/dunkel")===0)localStorage.setItem("BS_STIL","dunkel");
      else if(p==="/"||p==="")localStorage.removeItem("BS_STIL");
      var s=localStorage.getItem("BS_STIL");if(s)window.BS_STIL=s;}catch(e){}</script>
    <script type="module" crossorigin src="./assets/index-B5karten182.js"></script>
    <!-- Montserrat liegt hier im Projekt, nicht bei Google. Der Zeichner misst
         Texte auf dem Canvas und braucht die Schrift sofort; ueber das Netz
         geladen waere sie beim ersten Bild manchmal noch nicht da. Alle
         anderen Schriften der App liegen aus demselben Grund unter /fonts. -->
    <style>
      <!-- EINE Datei fuer alle Schnitte von 100 bis 900. Vorher lagen hier
           nur 400 und 700 als feste Schnitte; Light 300 - der Schnitt der
           Marke - haette ueber das Netz kommen muessen und waere beim ersten
           Zeichnen manchmal noch nicht da gewesen. Mit der Variablen kann
           kein Schnitt mehr fehlen. -->
      @font-face{font-family:Montserrat;src:url(./fonts/Montserrat-Variable.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:block}
      @font-face{font-family:"Bodoni Moda";src:url(./fonts/BodoniModa-Regular.woff2) format("woff2");font-weight:400;font-style:normal;font-display:block}
      @font-face{font-family:"Bodoni Moda";src:url(./fonts/BodoniModa-Bold.woff2) format("woff2");font-weight:700;font-style:normal;font-display:block}
      @font-face{font-family:"DM Serif Display";src:url(./fonts/DMSerifDisplay-Regular.woff2) format("woff2");font-weight:400;font-style:normal;font-display:block}
      @font-face{font-family:"DM Serif Display";src:url(./fonts/DMSerifDisplay-Italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:block}
      <!-- Roxborough CF. Wie Nohemi: von Connary Fagen, kostenpflichtig,
           darf nicht mitgeliefert werden. Anmeldung steht, es fehlt nur
           die Datei. Solange keine da ist, bleibt die Handschrift
           Shadows Into Light und es aendert sich nichts. -->
      @font-face{font-family:"Roxborough CF";src:url(./fonts/RoxboroughCF-Regular.woff2) format("woff2");font-weight:400;font-style:normal;font-display:block}
      @font-face{font-family:"Roxborough CF";src:url(./fonts/RoxboroughCF-Italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:block}
      @font-face{font-family:"Roxborough CF";src:url(./fonts/RoxboroughCF-Bold.woff2) format("woff2");font-weight:700;font-style:normal;font-display:block}
      <!-- Nohemi. Die Dateien liegen NICHT im Projekt: Nohemi ist von
           Pangram Pangram und fuer den kommerziellen Gebrauch
           kostenpflichtig, ich darf sie nicht mitliefern. Sobald die
           lizenzierten Dateien unter diesen Namen in site/fonts/
           liegen, greift die Schrift von selbst — die Anmeldung steht
           schon hier, es fehlt nur die Datei. Solange keine da ist,
           laeuft alles unveraendert weiter. -->
      @font-face{font-family:Nohemi;src:url(./fonts/Nohemi-Light.woff2) format("woff2");font-weight:300;font-style:normal;font-display:block}
      @font-face{font-family:Nohemi;src:url(./fonts/Nohemi-Regular.woff2) format("woff2");font-weight:400;font-style:normal;font-display:block}
      @font-face{font-family:Nohemi;src:url(./fonts/Nohemi-Medium.woff2) format("woff2");font-weight:500;font-style:normal;font-display:block}
      @font-face{font-family:Nohemi;src:url(./fonts/Nohemi-Bold.woff2) format("woff2");font-weight:700;font-style:normal;font-display:block}
      @font-face{font-family:"Shadows Into Light";src:url(./fonts/ShadowsIntoLight.woff2) format("woff2");font-weight:400;font-style:normal;font-display:block}
      @font-face{font-family:Prata;src:url(./fonts/Prata-Regular.woff2) format("woff2");font-weight:400;font-style:normal;font-display:block}
      @font-face{font-family:Italiana;src:url(./fonts/Italiana-Regular.woff2) format("woff2");font-weight:400;font-style:normal;font-display:block}
      @font-face{font-family:Marcellus;src:url(./fonts/Marcellus-Regular.woff2) format("woff2");font-weight:400;font-style:normal;font-display:block}
      @font-face{font-family:"Cormorant Garamond";src:url(./fonts/CormorantGaramond-Light.woff2) format("woff2");font-weight:300;font-style:normal;font-display:block}
      @font-face{font-family:"Cormorant Garamond";src:url(./fonts/CormorantGaramond-Regular.woff2) format("woff2");font-weight:400;font-style:normal;font-display:block}
    </style>
