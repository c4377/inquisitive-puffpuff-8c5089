    <!-- Welcher Stil. Der Pfad entscheidet und merkt es sich, weil die
         App ihre eigenen Adressen setzt (/content-planner und so weiter)
         und dabei das "/dunkel" verliert. Ohne das Merken waere der
         Zwilling nach dem ersten Klick wieder hell.
           /dunkel/...  schaltet dunkel und merkt es
           /            schaltet zurueck auf den Grundstil
           alles andere behaelt, was zuletzt galt
         Laeuft als gewoehnliches Skript, also VOR dem Modul. -->
    <script>try{var p=location.pathname;
      if(p.indexOf("/dunkel")===0)localStorage.setItem("BS_STIL","dunkel");
      else if(p==="/"||p==="")localStorage.removeItem("BS_STIL");
      var s=localStorage.getItem("BS_STIL");if(s)window.BS_STIL=s;}catch(e){}</script>
    <script type="module" crossorigin src="/assets/index-B5karten155.js"></script>
    <!-- Montserrat liegt hier im Projekt, nicht bei Google. Der Zeichner misst
         Texte auf dem Canvas und braucht die Schrift sofort; ueber das Netz
         geladen waere sie beim ersten Bild manchmal noch nicht da. Alle
         anderen Schriften der App liegen aus demselben Grund unter /fonts. -->
    <style>
      <!-- EINE Datei fuer alle Schnitte von 100 bis 900. Vorher lagen hier
           nur 400 und 700 als feste Schnitte; Light 300 - der Schnitt der

           kein Schnitt mehr fehlen. -->
      @font-face{font-family:Montserrat;src:url(/fonts/Montserrat-Variable.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:block}
