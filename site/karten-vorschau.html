<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reminder-Folien — Vorschau</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<style>
  @font-face{font-family:PoppinsBold;src:url(/fonts/Poppins-Bold.ttf) format("truetype");font-weight:400}
  @font-face{font-family:PoppinsBold;src:url(/fonts/Poppins-Bold.ttf) format("truetype");font-weight:700}
  @font-face{font-family:ArchivoBlack;src:url(/fonts/ArchivoBlack.ttf) format("truetype")}
  @font-face{font-family:"Playfair Display";src:url(/fonts/PlayfairDisplay-Regular.ttf) format("truetype")}
  @font-face{font-family:HelveticaNeueBrand;src:url(/fonts/HelveticaNeue-Roman.otf) format("opentype")}
  @font-face{font-family:HelveticaNeueLight;src:url(/fonts/HelveticaNeue-Light.otf) format("opentype")}
  body{font-family:-apple-system,system-ui,sans-serif;margin:24px;color:#141210;background:#fafafa}
  h1{font-size:20px;margin:0 0 4px}
  p.sub{font-size:13px;color:#666;margin:0 0 20px}
  .raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
  figure{margin:0}
  canvas{width:100%;height:auto;display:block;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
  figcaption{font-size:11px;color:#666;margin-top:6px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
</style>
</head>
<body>
<h1>Reminder-Folien — Zitat und Große Aussage</h1>
<p class="sub">Gleicher Zeichner wie in der App. Wenn hier Text steht, steht er auch im Content Plan.</p>
<div class="raster" id="raster"></div>

<script type="module">
const uA="#F6F1E6",lg="#141210",jV="#A88354",F1="#6B5238",kC="#64737B",IV="#8CA0B4",hA="#3E5063",wa="#F3E5AB";
const UV=e=>{const KA={
 zitat:{grund:"#F5EFE9",schrift:"#141210",betont:"#141210",monogramm:"#141210",absender:"rgba(20,18,16,0.55)",fassung:"zitat",schriftart:"Playfair Display"},
 aussage:{grund:"#16202E",schrift:"#F2EBE4",betont:"#F2EBE4",monogramm:"#F2EBE4",absender:"rgba(242,235,228,0.60)",fassung:"aussage",schriftart:"Playfair Display"}
};return KA[e]||{grund:lg,schrift:uA,betont:wa,monogramm:jV,absender:"rgba(246,241,230,0.55)"}};

const T1karte=k=>{const h=UV(k);return{istKarte:!0,grundFarbe:h.grund,schriftFarbe:h.schrift,highlight:h.betont,monogrammFarbe:h.monogramm,absenderFarbe:h.absender,fassung:h.fassung,schriftart:h.schriftart,schriftGrund:h.schriftGrund}};

const PROBEN=[
 ["zitat","Du hast diese Woche zwei Angebote nicht rausgeschickt, weil sie noch nicht fertig genug waren. Fertig genug gibt es *nicht*. Es gibt nur verschickt oder nicht verschickt."],
 ["zitat","Planen f\u00FChlt sich produktiv an, bringt aber *keinen Cent*."],
 ["aussage","Kein Move ist auch eine *Entscheidung* gegen Umsatz."],
 ["aussage","Du musst nicht *bereit* sein."]
];

const NAMEN={zitat:"Zitat",aussage:"Gro\u00DFe Aussage"};

const Pe={fabric};
const r=1080,n=1350,c=x=>x*0.8;

function zeichnen(art,text,ziel){
  const cv=new fabric.StaticCanvas(ziel,{width:r,height:n});
  const e=cv;
  const Je=T1karte(art);
  cv.backgroundColor=Je.grundFarbe;
  cv.add(new fabric.Rect({left:0,top:0,width:r,height:n,fill:Je.grundFarbe,selectable:!1,evented:!1}));
  // Handle unten links, wie im Vorschaubild
  const wt=(Je,rt)=>{
const ROH=String(rt||"").replace(/\s+/g," ").trim();
const FA=Je.fassung;
if(!ROH||!FA)return!1;
const SCH=Je.schriftFarbe||"#141210",ABS=Je.absenderFarbe||SCH;
const SERIF="Playfair Display";

/* Sternchen markieren EIN Wort oder eine Wendung kursiv — das ist
   der Kniff, der diesen Folien ihre Betonung gibt. */
const worte=[];
ROH.split(/(\*[^*]+\*)/).filter(Boolean).forEach(st=>{
const ku=/^\*[^*]+\*$/.test(st);
(ku?st.slice(1,-1):st).split(/\s+/).filter(Boolean).forEach(w=>worte.push({w:w,kursiv:ku}))});
if(!worte.length)return!1;

const miss=(w,gr,ku)=>new Pe.fabric.Text(String(w),{fontSize:gr,fontFamily:SERIF,fontStyle:ku?"italic":"normal"}).width;
const brechen=(gr,maxB)=>{const sp=miss("\u00a0",gr,!1)||gr*.26,zeilen=[];let z=[],br=0;
worte.forEach(o=>{const b=miss(o.w,gr,o.kursiv);
if(z.length&&br+sp+b>maxB){zeilen.push({worte:z,breite:br}),z=[],br=0}
br+=(z.length?sp:0)+b,z.push({...o,b:b})});
z.length&&zeilen.push({worte:z,breite:br});
return{zeilen:zeilen,abstand:sp}};

const L=r*.09,MAXB=r*.82,ZH=1.16;
const start=FA==="aussage"?c(74):c(44);
const maxZeilen=FA==="aussage"?5:9;
const maxHoehe=n*.60;
let gr=start,satz=brechen(gr,MAXB);
for(let i=0;i<26;i+=1){
const hoch=satz.zeilen.length*gr*ZH,breit=Math.max(...satz.zeilen.map(z=>z.breite));
if(satz.zeilen.length<=maxZeilen&&hoch<=maxHoehe&&breit<=MAXB)break;
gr*=.94,satz=brechen(gr,MAXB)}

const hoch=satz.zeilen.length*gr*ZH;
let y=n*.46-hoch/2+gr*.5;
satz.zeilen.forEach(z=>{
let x=L;
z.worte.forEach(o=>{
e.add(new Pe.fabric.Text(o.w,{left:x,top:y,originX:"left",originY:"center",
fontSize:gr,fontFamily:SERIF,fontStyle:o.kursiv?"italic":"normal",
fill:SCH,selectable:!1,evented:!1}));
x+=o.b+satz.abstand});
y+=gr*ZH});

e.add(new Pe.fabric.Text("carinaannaprav",{left:r/2,top:n*.905,originX:"center",originY:"center",
fontSize:c(17),fontFamily:SERIF,charSpacing:60,fill:ABS,selectable:!1,evented:!1}));
return!0};
  const ok=wt(Je,text);
  cv.renderAll();
  return ok;
}

async function los(){
  try{
    await Promise.all(["PoppinsBold","ArchivoBlack","Playfair Display","HelveticaNeueBrand","HelveticaNeueLight"]
      .flatMap(f=>[document.fonts.load(`400 40px "${f}"`),document.fonts.load(`700 40px "${f}"`)]));
  }catch{}
  const raster=document.getElementById("raster");
  PROBEN.forEach(([art,text])=>{
    const fig=document.createElement("figure");
    const cv=document.createElement("canvas");
    fig.appendChild(cv);
    const cap=document.createElement("figcaption");
    fig.appendChild(cap);
    raster.appendChild(fig);
    const ok=zeichnen(art,text,cv);
    cap.textContent=NAMEN[art]+(ok?"":"  \u2014 R\u00DCCKFALL, Text zu lang");
  });
}
los();
</script>
</body>
</html>
