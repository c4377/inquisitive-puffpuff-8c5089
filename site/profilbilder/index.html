<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrandStudio — Profilbilder</title>
    <style>
      @font-face{font-family:"DM Serif Display";src:url(/fonts/DMSerifDisplay-Regular.woff2) format("woff2");font-weight:400;font-style:normal;font-display:block}
      @font-face{font-family:"Shadows Into Light";src:url(/fonts/ShadowsIntoLight.woff2) format("woff2");font-weight:400;font-style:normal;font-display:block}
      :root{color-scheme:light}
      *{box-sizing:border-box}
      body{margin:0;background:#F6F2EB;color:#241C16;
        font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
      header{position:sticky;top:0;z-index:10;padding:14px 18px;background:rgba(246,242,235,.92);
        backdrop-filter:blur(8px);border-bottom:1px solid rgba(36,28,22,.10);
        display:flex;align-items:center;gap:14px;flex-wrap:wrap}
      h1{margin:0;font:400 22px/1 "DM Serif Display",Georgia,serif}
      .zurueck{color:#241C16;text-decoration:none;opacity:.55;font-size:13px}
      .zurueck:hover{opacity:1}
      .regler{display:flex;align-items:center;gap:7px;font-size:12px;opacity:.72}
      .regler input{width:96px;accent-color:#E8836B}
      .regler span{min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
      main{padding:18px}
      .hinweis{max-width:52ch;opacity:.62;font-size:13px;margin:0 0 18px}
      .raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
      figure{margin:0;text-align:center}
      .rund{width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:#171512;
        box-shadow:0 2px 10px rgba(36,28,22,.16);cursor:pointer;display:block}
      .rund canvas{width:100%;height:100%;display:block}
      figcaption{margin-top:7px;font-size:12px;opacity:.55}
      .leer{opacity:.6;font-size:14px}
      @media (prefers-color-scheme: dark){
        :root{color-scheme:dark}
        body{background:#171512;color:#F2EFE9}
        header{background:rgba(23,21,18,.92);border-bottom-color:rgba(242,239,233,.12)}
        .zurueck{color:#F2EFE9}
        .rund{box-shadow:0 2px 10px rgba(0,0,0,.45)}
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Profilbilder</h1>
      <a class="zurueck" href="/dunkel/">&larr; zurück zum Plan</a>
      <label class="regler">Schwarz
        <input id="schwarz" type="range" min="0" max="160" step="5">
        <span id="schwarzWert"></span>
      </label>
      <label class="regler">Zoom
        <input id="zoom" type="range" min="100" max="260" step="5">
        <span id="zoomWert"></span>
      </label>
      <label class="regler">Höhe
        <input id="hoehe" type="range" min="0" max="100" step="2">
        <span id="hoeheWert"></span>
      </label>
    </header>
    <main>
      <p class="hinweis">Jedes Bild aus der Mediathek als rundes Profilbild, im dunklen Stil.
        Antippen lädt es als PNG mit 640&nbsp;×&nbsp;640 herunter.</p>
      <div class="raster" id="raster"><p class="leer">lädt …</p></div>
    </main>
    <script src="/profilbilder/profilbilder.js"></script>
  </body>
</html>
